services:
  bridge:
    build: .
    container_name: dcc-bridge
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - dcc-net
    # Secrets live in .env and are injected as environment variables.
    # bridge_config.json references them via ${ENV:VAR} placeholders. See
    # docs/bridge-secrets.md and issue #252.
    env_file:
      - .env
    volumes:
      - ./bridge_config.json:/app/bridge_config.json
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  dcc-net:
    external: true
    name: dcc_dcc-net
